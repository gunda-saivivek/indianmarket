# ==========================================
# MARKET SNIPER SHOOTERS - APPLICATION CONFIG
# ==========================================
server.port=8080

# Application Identity
spring.application.name=market-sniper-backend

# Default Database: Embedded H2 for Zero-Setup Out of Box Testing
# (Switch to MySQL via: spring.profiles.active=mysql)
spring.datasource.url=jdbc:h2:mem:marketsniperdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Stateless JWT Security Configuration
app.jwtSecret=MarketSniperShootersSuperSecretKeyThatIsAtLeast256BitsLong2026Secure
app.jwtExpirationMs=86400000
