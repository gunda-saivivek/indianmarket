name: Continuous Deployment to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Code Syntax & Zero Vulnerabilities
        run: |
          node -c server.js
          node -c public/app.js
          npm audit

      - name: Trigger Render Deploy Hook
        run: |
          DEPLOY_HOOK="${{ secrets.RENDER_DEPLOY_HOOK }}"
          if [ -z "$DEPLOY_HOOK" ]; then
            DEPLOY_HOOK="https://api.render.com/deploy/srv-dbinkdijnfac73b4gj5g?key=e81aui2q1Yw"
          fi
          echo "🚀 Triggering Render auto-deployment via Deploy Hook..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_HOOK")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Render Response Code: $HTTP_CODE"
          echo "Render Response: $BODY"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "🎉 Successfully triggered Render deployment!"
          else
            echo "❌ Render deploy hook returned error code: $HTTP_CODE"
            exit 1
          fi
